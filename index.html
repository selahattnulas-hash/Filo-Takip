async function stmPdf(){
  if(!SD)return;const D=SD,W=1240,H=1754,P=60,F=(s,w)=>`${w||400} ${s}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`,cols=[[0,120,"Tarih"],[120,80,"Saat"],[200,150,"Tür"],[350,110,"Kod"],[460,390,"Güzergah"],[850,70,"Kişi"],[920,90,"Tip"],[1010,110,"Tutar"]];

    x.fillStyle="#0d6b5c";x.fillRect(0,0,W,150);x.fillStyle="#fff";x.font=F(44,700);x.fillText("Döküm · "+D.an,P,34);x.font=F(28);x.fillText(`${co.name||""}   ·   ${dmY(D.from)} – ${dmY(D.to)}   ·   sayfa ${pi+1}/${np}`,P,96);

    rows.slice(pi*per,(pi+1)*per).forEach((r,i)=>{if(i%2){x.fillStyle="#f3f6f8";x.fillRect(P,y-4,W-2*P,36)}x.font=F(22);x.fillStyle=r[2]=="Kesinti"?"#b83a2b":"#16202b";cols.forEach((k,ci)=>x.fillText(fit(r[ci],k[1]),P+k[0],y));y+=36});
    if(pi==np-1){y+=24;x.fillStyle="#d9dfe6";x.fillRect(P,y,W-2*P,2);y+=20;x.fillStyle="#16202b";
      Object.keys(D.T).forEach(cu=>{const t=D.T[cu];x.font=F(26);x.fillText(`İşler (${cu}): ${fc(t.is,cu)}${t.kes?"   ·   Kesinti: "+fc(t.kes,cu):""}`,P,y);y+=40;x.font=F(30,700);x.fillText(`Net: ${fc(t.is+t.kes,cu)}`,P,y);y+=54});

async function settle(k,id,cur,bal){
  const t=prompt((k=="d"?"Teslim alınan tutar (":"Tutar (")+cur+")",Math.abs(bal));if(t===null)return;
  const a=num(t);if(a==null||a<=0){alert("Geçerli bir tutar yaz.");return}
  if(a>Math.abs(bal)+0.005&&!confirm("Yazdığın tutar bakiyeden fazla. Devam edilsin mi?"))return;
  const row={company_id:co.id,currency:cur,amount:(bal>0?-1:1)*a,kind:k=="d"?"teslim":"odeme"};
  row[k=="d"?"driver_id":"agency_id"]=id;
  const r=await sb.from("ledger_entries").insert(row);
  if(r.error){alert(errText(r.error));return}await vehiclesView(k=="d"?"s":"c");
}
async function addVeh(){
  let plate=$("#pl").value.trim().toLocaleUpperCase("tr").replace(/\s+/g," ");
  if(!plate){msg("Plakayı yaz.",true);return}
  const pm2=plate.replace(/\s/g,"").match(/^(\d{2})([A-ZÇĞİÖŞÜ]{1,3})(\d{2,5})$/);if(pm2)plate=pm2[1]+" "+pm2[2]+" "+pm2[3];
  if(VEH.some(v=>v.plate.replace(/\s/g,"")==plate.replace(/\s/g,""))){msg("Bu plaka zaten kayıtlı.",true);return}
  const o=num($("#od").value);
  const r=await sb.from("vehicles").insert({company_id:co.id,plate,monthly_fixed_cost:num($("#fx").value)||0,base_consumption:num($("#bc").value),home_city:$("#hc").value.trim()||null,capacity:(c=>c&&c>0?Math.round(c):null)(num($("#cp").value)),odometer_km:o==null?null:Math.round(o)});
  if(r.error){msg(r.error.code==="23505"?"Bu plaka zaten kayıtlı.":"Kaydedilemedi: "+r.error.message,true);return}
  await vehiclesView();
}
async function delVeh(id,plate){
  if(!confirm(plate+" aracı silinsin mi?"))return;
  const r=await sb.from("vehicles").delete().eq("id",id);
  if(r.error){alert("Silinemedi: bu araca bağlı sefer ya da kayıtlar olabilir.");return}
  await vehiclesView();
}
