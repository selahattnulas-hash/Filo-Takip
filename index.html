<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo Takip</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#16202b;--mu:#5b6776;--bd:#d9dfe6;--ac:#0d6b5c;--bad:#b83a2b}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--tx:#e9eef4;--mu:#93a1b3;--bd:#2a3644;--ac:#3dbfa8;--bad:#f07a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
button.x{background:none;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
.veh{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding:10px 0}
.veh:first-of-type{border:0}
.k{color:var(--mu);font-size:12px}
.bad{color:var(--bad)}.ok{color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:none;padding:10px 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.sum b{display:block;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px}
.pos{color:var(--ac);font-weight:700}.neg{color:var(--bad);font-weight:700}.warn{color:#c77e00;font-weight:700}
.tag{font-size:12px;color:#c77e00;margin-right:6px}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--tx)}.chk input{width:auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
</head>
<body><main id="app"><p class="sub">Yükleniyor…</p></main>
<script>
const sb=supabase.createClient("https://itsdtgvicgynymjrdhgn.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0c2R0Z3ZpY2d5bnltanJkaGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzgzODYsImV4cCI6MjEwOTkxNDM4Nn0.Ijcs7mARscVWeesvVeyfBL9UIyfa9ddqL094k55iaKE");
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
function msg(t,bad){const m=$("#msg");if(m){m.textContent=t||"";m.className=bad?"bad":"ok"}}
let user=null,co=null;

async function boot(){
  const r=await sb.auth.getSession();
  user=r.data.session?r.data.session.user:null;
  user?await home():authView();
}

function authView(){
  $("#app").innerHTML=`<h1>Filo Takip</h1><p class="sub">Araç başı kâr, maliyet ve iş takibi</p>
  <div class="card"><h2>Giriş</h2>
  <label>E-posta</label><input id="em" type="email" autocomplete="email">
  <label>Şifre (en az 6 karakter)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button onclick="login()">Giriş yap</button><button class="alt" onclick="signup()">Kayıt ol</button></div>
  <p id="msg" class="sub"></p></div>`;
}
async function login(){
  msg("Giriş yapılıyor…");
  const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(r.error){msg("Giriş yapılamadı: e-posta veya şifre hatalı ya da e-posta henüz doğrulanmadı.",true);return}
  user=r.data.user;await home();
}
async function signup(){
  const email=$("#em").value.trim(),password=$("#pw").value;
  if(!email||password.length<6){msg("E-posta yaz ve en az 6 karakterlik şifre belirle.",true);return}
  msg("Kayıt yapılıyor…");
  const r=await sb.auth.signUp({email,password});
  if(r.error){msg("Kayıt yapılamadı: "+r.error.message,true);return}
  if(r.data.session){user=r.data.user;await home()}
  else msg("Kayıt alındı. E-postana gelen doğrulama bağlantısına tıkla, sonra giriş yap.");
}
async function logout(){await sb.auth.signOut();user=null;co=null;authView()}

async function home(){
  const r=await sb.from("company_members").select("company_id, role, companies(name)").limit(1);
  if(r.error){$("#app").innerHTML=`<p class="bad">Veri okunamadı: ${esc(r.error.message)}</p>`;return}
  if(!r.data.length){companyView();return}
  co={id:r.data[0].company_id,name:r.data[0].companies?r.data[0].companies.name:""};
  await vehiclesView();
}

function companyView(){
  $("#app").innerHTML=`<h1>Hoş geldin</h1><p class="sub">Başlamak için firmanı oluştur.</p>
  <div class="card"><label>Firma adı</label><input id="cn">
  <div class="row"><button onclick="makeCompany()">Firmayı oluştur</button><button class="alt" onclick="logout()">Çıkış</button></div>
  <p id="msg" class="sub"></p></div>`;
}
async function makeCompany(){
  const name=$("#cn").value.trim();
  if(!name){msg("Firma adını yaz.",true);return}
  msg("Oluşturuluyor…");
  const c=await sb.from("companies").insert({name}).select("id,name").single();
  if(c.error){msg("Firma oluşturulamadı: "+c.error.message,true);return}
  const m=await sb.from("company_members").insert({company_id:c.data.id,user_id:user.id,role:"owner"});
  if(m.error){msg("Üyelik eklenemedi: "+m.error.message,true);return}
  co={id:c.data.id,name:c.data.name};await vehiclesView();
}

let TAB="p",VEH=[],DRV=[],AGN=[];
const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0),fm=n=>Math.round(n).toLocaleString("tr-TR")+" ₺";
async function vehiclesView(t){
  TAB=t||TAB;
  const [r,dr,ag]=await Promise.all([sb.from("vehicles").select("*").eq("company_id",co.id).order("plate"),sb.from("drivers").select("*").eq("company_id",co.id).order("name"),sb.from("agencies").select("id,name").eq("company_id",co.id).order("name")]);
  VEH=r.data||[];DRV=dr.data||[];AGN=ag.data||[];
  $("#app").innerHTML=`<div class="top"><div><h1>${esc(co.name)}</h1><p class="sub">${esc(user.email)}</p></div><button class="alt" onclick="logout()">Çıkış</button></div>
  <div class="tabs">${[["p","Panel"],["j","İşler"],["s","Şoförler"],["c","Cari"],["t","Seferler"],["v","Araçlar"]].map(x=>`<button class="${TAB==x[0]?"":"alt"}" onclick="vehiclesView('${x[0]}')">${x[1]}</button>`).join("")}</div><div id="tab"></div>`;
  await ({p:panelTab,j:jobTab,s:drvTab,c:cariTab,t:tripTab,v:vehTab})[TAB]();
}
async function panelTab(){
  if(!VEH.length){$("#tab").innerHTML=`<p class="sub">Önce Araçlar sekmesinden araç ekle.</p>`;return}
  const from=new Date(Date.now()-29*864e5).toISOString().slice(0,10);
  const r=await sb.from("trips").select("vehicle_id,revenue,fuel_cost,other_cost,km,fuel_liters,trip_date").eq("company_id",co.id).gte("trip_date",from);
  const T=r.data||[];
  const rows=VEH.map(v=>{const t=T.filter(x=>x.vehicle_id==v.id),g=sum(t,"revenue"),km=sum(t,"km"),L=sum(t,"fuel_liters"),days=new Set(t.map(x=>x.trip_date)).size,cost=sum(t,"fuel_cost")+sum(t,"other_cost")+Number(v.monthly_fixed_cost||0);return{v,g,cost,net:g-cost,km,days,l:km?L/km*100:0,dc:days?cost/days:0,kc:km?cost/km:0}});
  const G=sum(rows,"g"),C=sum(rows,"cost");
  $("#tab").innerHTML=`<p class="sub">Son 30 gün. Sabit gider aylık tutar olarak eklenir.</p>
  <div class="sum"><div><span class="k">Gelir</span><b>${fm(G)}</b></div><div><span class="k">Gider</span><b>${fm(C)}</b></div><div><span class="k">Net</span><b class="${G-C>=0?"pos":"neg"}">${fm(G-C)}</b></div></div>`+
  rows.map(x=>{const hi=x.v.base_consumption&&x.l>x.v.base_consumption*1.1;return `<div class="card"><div class="top"><b>${esc(x.v.plate)}</b><span class="${x.net>=0?"pos":"neg"}">${fm(x.net)} net</span></div><div class="g2"><div><span class="k">Günlük maliyet</span><br><b>${x.days?fm(x.dc):"-"}</b></div><div><span class="k">Km başı maliyet</span><br><b>${x.km?x.kc.toFixed(1)+" ₺":"-"}</b></div><div><span class="k">Çalışılan gün</span><br><b>${x.days}</b></div><div><span class="k">L/100 km</span><br><b class="${hi?"warn":""}">${x.km&&x.l?x.l.toFixed(1):"-"}${hi?" (yüksek)":""}</b></div></div></div>`}).join("");
}
async function tripTab(){
  if(!VEH.length){$("#tab").innerHTML=`<p class="sub">Önce Araçlar sekmesinden araç ekle.</p>`;return}
  const [r,ag]=await Promise.all([
    sb.from("trips").select("id,trip_date,km,revenue,fuel_cost,other_cost,invoiced,collected_on,vehicle_id,agency_id").eq("company_id",co.id).order("trip_date",{ascending:false}).limit(20),
    sb.from("agencies").select("id,name").eq("company_id",co.id)]);
  const an={};(ag.data||[]).forEach(a=>an[a.id]=a.name);
  const pv={};VEH.forEach(v=>pv[v.id]=v.plate);
  const opt=VEH.map(v=>`<option value="${v.id}">${esc(v.plate)}</option>`).join("");
  const list=(r.data||[]).map(t=>`<div class="veh"><div><b>${esc(pv[t.vehicle_id]||"")}</b> <span class="k">${t.trip_date.slice(8)+"."+t.trip_date.slice(5,7)} · ${esc(an[t.agency_id]||"acenta yok")} · ${t.km} km</span><br><span class="${t.revenue-t.fuel_cost-t.other_cost>=0?"pos":"neg"}">${fm(t.revenue-t.fuel_cost-t.other_cost)}</span> <span class="k">(gelir ${fm(t.revenue)})</span><br>${t.invoiced?"":'<span class="tag">fatura kesilmedi</span>'}${t.collected_on?"":'<span class="tag">tahsil edilmedi</span>'}</div><div>${t.collected_on?"":`<button class="x" onclick="markPaid('${t.id}')">Tahsil edildi</button>`}<button class="x" onclick="delTrip('${t.id}')">Sil</button></div></div>`).join("")||`<p class="sub">Henüz sefer yok.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>Sefer ekle</h2>
  <label>Araç</label><select id="tv">${opt}</select>
  <div class="f2"><div><label>Tarih</label><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Acenta</label><input id="ta"></div>
  <div><label>Km</label><input id="tk" inputmode="numeric"></div><div><label>Gelir (₺)</label><input id="tg" inputmode="decimal"></div>
  <div><label>Yakıt (litre)</label><input id="tl" inputmode="decimal"></div><div><label>Yakıt tutarı (₺)</label><input id="ty" inputmode="decimal"></div>
  <div><label>Geçiş ve diğer (₺)</label><input id="to" inputmode="decimal"></div></div>
  <label class="chk"><input id="ti" type="checkbox"> Fatura kesildi</label>
  <div class="row"><button onclick="addTrip()">Seferi kaydet</button></div><p id="msg" class="sub"></p></div>
  <div class="card"><h2>Son seferler</h2>${list}</div>`;
}
async function addTrip(){
  const km=num($("#tk").value),g=num($("#tg").value);
  if(km==null||g==null){msg("Km ve gelir zorunlu.",true);return}
  let aid=null;const an=$("#ta").value.trim();
  if(an){const a=await sb.from("agencies").upsert({company_id:co.id,name:an},{onConflict:"company_id,name"}).select("id").single();
    if(a.error){msg("Acenta kaydedilemedi: "+a.error.message,true);return}aid=a.data.id}
  const r=await sb.from("trips").insert({company_id:co.id,vehicle_id:$("#tv").value,agency_id:aid,trip_date:$("#td").value,km:Math.round(km),revenue:g,fuel_liters:num($("#tl").value)||0,fuel_cost:num($("#ty").value)||0,other_cost:num($("#to").value)||0,invoiced:$("#ti").checked});
  if(r.error){msg("Kaydedilemedi: "+r.error.message,true);return}
  await vehiclesView("t");
}
async function markPaid(id){
  const r=await sb.from("trips").update({collected_on:new Date().toISOString().slice(0,10),invoiced:true}).eq("id",id);
  if(r.error){alert("Güncellenemedi: "+r.error.message);return}await vehiclesView("t");
}
async function delTrip(id){
  if(!confirm("Sefer silinsin mi?"))return;
  const r=await sb.from("trips").delete().eq("id",id);
  if(r.error){alert("Silinemedi: "+r.error.message);return}await vehiclesView("t");
}
function vehTab(){
  const list=VEH.map(v=>`<div class="veh"><div><b>${esc(v.plate)}</b><br><span class="k">Sabit gider ${Number(v.monthly_fixed_cost).toLocaleString("tr-TR")} ₺/ay${v.base_consumption?" · "+v.base_consumption+" L/100 km":""}${v.home_city?" · "+esc(v.home_city):""}${v.odometer_km?" · "+Number(v.odometer_km).toLocaleString("tr-TR")+" km":""}</span></div><button class="x" onclick="delVeh('${v.id}','${esc(v.plate)}')">Sil</button></div>`).join("")||`<p class="sub">Henüz araç yok. Aşağıdan ilk aracını ekle.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>Araçlar</h2>${list}</div>
  <div class="card"><h2>Araç ekle</h2>
  <label>Plaka</label><input id="pl" placeholder="48 ABC 123" autocapitalize="characters">
  <div class="f2"><div><label>Aylık sabit gider (₺)</label><input id="fx" inputmode="decimal" placeholder="sigorta, kredi, bakım payı"></div><div><label>Ort. tüketim (L/100 km)</label><input id="bc" inputmode="decimal"></div>
  <div><label>Bulunduğu şehir</label><input id="hc" placeholder="Bodrum"></div><div><label>Km saati</label><input id="od" inputmode="numeric"></div></div>
  <div class="row"><button onclick="addVeh()">Aracı kaydet</button></div><p id="msg" class="sub"></p></div>`;
}
const CUR={TRY:"₺",EUR:"€",USD:"$",GBP:"£"},CM={sofor_nakit:"Şoför nakit",acenta_cari:"Acenta cari",ofis:"Ofiste",kart:"Kart"};
const fc=(n,c)=>Number(n).toLocaleString("tr-TR",{maximumFractionDigits:2})+" "+(CUR[c]||c);
async function agId(name){
  name=(name||"").trim();if(!name)return null;
  const a=await sb.from("agencies").upsert({company_id:co.id,name},{onConflict:"company_id,name"}).select("id").single();
  if(a.error)throw new Error("Acenta kaydedilemedi: "+a.error.message);return a.data.id;
}
async function jobTab(){
  const r=await sb.from("jobs").select("*").eq("company_id",co.id).order("job_date",{ascending:false}).order("pickup_time",{ascending:false}).limit(30);
  const dn={},an={},pv={};DRV.forEach(x=>dn[x.id]=x.name);AGN.forEach(x=>an[x.id]=x.name);VEH.forEach(x=>pv[x.id]=x.plate);
  const o=(a,f)=>a.map(f).join("");
  const list=(r.data||[]).map(j=>{const done=j.status=="tamamlandi";return `<div class="veh"><div><b>${esc(j.from_city||"?")} → ${esc(j.to_city||"?")}</b> <span class="k">${j.job_date.slice(8)+"."+j.job_date.slice(5,7)}${j.pickup_time?" "+j.pickup_time.slice(0,5):""}${j.pax?" · "+j.pax+" kişi":""}${j.guest_name?" · "+esc(j.guest_name):""}</span><br><span class="k">${esc(dn[j.driver_id]||"şoför yok")} · ${esc(pv[j.vehicle_id]||j.vehicle_type||"araç yok")} · ${esc(an[j.agency_id]||"acenta yok")}</span><br><b>${fc(j.amount,j.currency)}</b> <span class="tag">${CM[j.collection_mode]}</span>${j.invoiced?"":'<span class="tag">faturasız</span>'}${j.partner_share>0?`<span class="k">pay ${fc(j.partner_share,j.currency)} → ${esc(an[j.partner_agency_id]||"?")}</span>`:""}</div><div>${done?'<span class="ok">✓ Bitti</span>':`<button class="x" onclick="doneJob('${j.id}')">Tamamlandı</button>`}<button class="x" onclick="delJob('${j.id}')">Sil</button></div></div>`}).join("")||`<p class="sub">Henüz iş yok.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>İş ekle</h2>
  <div class="f2"><div><label>Tarih</label><input id="jd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Saat</label><input id="jh" type="time"></div>
  <div><label>Nereden</label><input id="jf"></div><div><label>Nereye</label><input id="jn"></div>
  <div><label>Tür</label><select id="jy"><option value="">-</option><option value="varis">Varış</option><option value="depar">Depar</option><option value="transfer">Transfer</option></select></div><div><label>Kişi sayısı</label><input id="jp" inputmode="numeric"></div>
  <div><label>Misafir</label><input id="jg"></div><div><label>Araç tipi</label><input id="jt" placeholder="Vito"></div>
  <div><label>Şoför</label><select id="jr"><option value="">Seçilmedi</option>${o(DRV,x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div><div><label>Araç</label><select id="jv"><option value="">Seçilmedi</option>${o(VEH,x=>`<option value="${x.id}">${esc(x.plate)}</option>`)}</select></div>
  <div><label>Tutar</label><input id="jm" inputmode="decimal"></div><div><label>Para birimi</label><select id="jc"><option>TRY</option><option>EUR</option><option>USD</option><option>GBP</option></select></div>
  <div><label>Tahsilat şekli</label><select id="jk"><option value="sofor_nakit">Şoför nakit alır</option><option value="acenta_cari">Acenta cari</option><option value="ofis">Ofiste ödenir</option><option value="kart">Kart</option></select></div><div><label>Acenta (müşteri)</label><input id="ja"></div>
  <div><label>İşi atan firma</label><input id="jo"></div><div><label>İşi atana pay (aynı para birimi)</label><input id="js" inputmode="decimal"></div></div>
  <label class="chk"><input id="jf2" type="checkbox" checked> Faturalı iş</label>
  <div class="row"><button onclick="addJob()">İşi kaydet</button></div><p id="msg" class="sub"></p></div>
  <div class="card"><h2>İşler</h2>${list}</div>`;
}
async function addJob(){
  const v=id=>$("#"+id).value,m=num(v("jm"));
  if(m==null||!v("jd")){msg("Tarih ve tutar zorunlu.",true);return}
  try{
    const aid=await agId(v("ja")),pid=await agId(v("jo")),p=num(v("jp"));
    const r=await sb.from("jobs").insert({company_id:co.id,job_date:v("jd"),pickup_time:v("jh")||null,job_type:v("jy")||null,from_city:v("jf").trim()||null,to_city:v("jn").trim()||null,vehicle_type:v("jt").trim()||null,driver_id:v("jr")||null,vehicle_id:v("jv")||null,guest_name:v("jg").trim()||null,pax:p?Math.round(p):null,agency_id:aid,amount:m,currency:v("jc"),collection_mode:v("jk"),invoiced:$("#jf2").checked,partner_agency_id:pid,partner_share:num(v("js"))||0});
    if(r.error)throw new Error(r.error.message);
  }catch(e){msg("Kaydedilemedi: "+e.message,true);return}
  await vehiclesView("j");
}
async function doneJob(id){
  const j=(await sb.from("jobs").select("amount,currency,collection_mode").eq("id",id).single()).data;
  let c=null;
  if(j&&j.collection_mode=="sofor_nakit"){const t=prompt("Şoförün tahsil ettiği tutar ("+j.currency+")",j.amount);if(t===null)return;c=num(t);if(c==null){alert("Geçerli bir tutar yaz.");return}}
  const r=await sb.rpc("complete_job",{p_job:id,p_collected:c});
  if(r.error){alert(r.error.message);return}
  await vehiclesView("j");
}
async function delJob(id){
  if(!confirm("İş silinsin mi?"))return;
  const r=await sb.from("jobs").delete().eq("id",id);
  if(r.error){alert("Silinemedi: bu işe bağlı para hareketi olabilir.");return}await vehiclesView("j");
}
async function drvTab(){
  const b=await sb.from("ledger_balances").select("driver_id,currency,balance").eq("company_id",co.id).not("driver_id","is",null);
  const bal={};(b.data||[]).forEach(x=>{(bal[x.driver_id]=bal[x.driver_id]||[]).push(x)});
  const list=DRV.map(d=>{const bs=(bal[d.id]||[]).filter(x=>Number(x.balance)!=0);return `<div class="veh"><div><b>${esc(d.name)}</b> <span class="k">${esc(d.phone||"")}</span><br>${bs.length?bs.map(x=>`<span class="warn">${fc(x.balance,x.currency)}</span> <button class="x" onclick="settle('d','${d.id}','${x.currency}',${x.balance})">Teslim aldım</button>`).join("<br>"):'<span class="k">Üzerinde para yok</span>'}</div><button class="x" onclick="delDrv('${d.id}')">Sil</button></div>`}).join("")||`<p class="sub">Henüz şoför yok.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>Şoförler ve üzerindeki para</h2>${list}</div><div class="card"><h2>Şoför ekle</h2><label>Ad soyad</label><input id="dn"><label>Telefon</label><input id="dp" inputmode="tel"><div class="row"><button onclick="addDrv()">Şoförü kaydet</button></div><p id="msg" class="sub"></p></div>`;
}
async function addDrv(){
  const n=$("#dn").value.trim();if(!n){msg("Ad soyad yaz.",true);return}
  const r=await sb.from("drivers").insert({company_id:co.id,name:n,phone:$("#dp").value.trim()||null});
  if(r.error){msg(r.error.code==="23505"?"Bu isimde şoför var.":"Kaydedilemedi: "+r.error.message,true);return}await vehiclesView("s");
}
async function delDrv(id){
  if(!confirm("Şoför silinsin mi?"))return;
  const r=await sb.from("drivers").delete().eq("id",id);
  if(r.error){alert("Silinemedi: şoföre bağlı iş ya da para hareketi var.");return}await vehiclesView("s");
}
async function cariTab(){
  const b=await sb.from("ledger_balances").select("agency_id,currency,balance").eq("company_id",co.id).not("agency_id","is",null);
  const bal={};(b.data||[]).forEach(x=>{if(Number(x.balance)!=0)(bal[x.agency_id]=bal[x.agency_id]||[]).push(x)});
  const list=AGN.filter(a=>bal[a.id]).map(a=>`<div class="veh"><div><b>${esc(a.name)}</b><br>${bal[a.id].map(x=>`<span class="${x.balance>0?"pos":"neg"}">${fc(Math.abs(x.balance),x.currency)} ${x.balance>0?"bize borçlu":"biz borçluyuz"}</span> <button class="x" onclick="settle('a','${a.id}','${x.currency}',${x.balance})">${x.balance>0?"Ödeme aldık":"Ödeme yaptık"}</button>`).join("<br>")}</div></div>`).join("")||`<p class="sub">Açık cari bakiye yok. İşleri tamamladıkça burada görünür.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>Cari hesaplar</h2><p class="sub">Para birimleri ayrı ayrı tutulur, birbirine çevrilmez.</p>${list}</div>`;
}
async function settle(k,id,cur,bal){
  const t=prompt((k=="d"?"Teslim alınan tutar (":"Tutar (")+cur+")",Math.abs(bal));if(t===null)return;
  const a=num(t);if(a==null||a<=0){alert("Geçerli bir tutar yaz.");return}
  const row={company_id:co.id,currency:cur,amount:(bal>0?-1:1)*a,kind:k=="d"?"teslim":"odeme"};
  row[k=="d"?"driver_id":"agency_id"]=id;
  const r=await sb.from("ledger_entries").insert(row);
  if(r.error){alert(r.error.message);return}await vehiclesView(k=="d"?"s":"c");
}
async function addVeh(){
  const plate=$("#pl").value.trim().toUpperCase();
  if(!plate){msg("Plakayı yaz.",true);return}
  const o=num($("#od").value);
  const r=await sb.from("vehicles").insert({company_id:co.id,plate,monthly_fixed_cost:num($("#fx").value)||0,base_consumption:num($("#bc").value),home_city:$("#hc").value.trim()||null,odometer_km:o==null?null:Math.round(o)});
  if(r.error){msg(r.error.code==="23505"?"Bu plaka zaten kayıtlı.":"Kaydedilemedi: "+r.error.message,true);return}
  await vehiclesView();
}
async function delVeh(id,plate){
  if(!confirm(plate+" aracı silinsin mi?"))return;
  const r=await sb.from("vehicles").delete().eq("id",id);
  if(r.error){alert("Silinemedi: bu araca bağlı sefer ya da kayıtlar olabilir.");return}
  await vehiclesView();
}
boot();
</script></body></html>
