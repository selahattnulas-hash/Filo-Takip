<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo Takip</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#16202b;--mu:#5b6776;--bd:#d9dfe6;--ac:#0d6b5c;--bad:#b83a2b}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--tx:#e9eef4;--mu:#93a1b3;--bd:#2a3644;--ac:#3dbfa8;--bad:#f07a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
button.x{background:none;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
.veh{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding:10px 0}
.veh:first-of-type{border:0}
.k{color:var(--mu);font-size:12px}
.bad{color:var(--bad)}.ok{color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:none;padding:10px 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.sum b{display:block;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px}
.pos{color:var(--ac);font-weight:700}.neg{color:var(--bad);font-weight:700}.warn{color:#c77e00;font-weight:700}
.tag{font-size:12px;color:#c77e00;margin-right:6px}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--tx)}.chk input{width:auto}
.sm{padding:6px;margin-top:4px;width:auto;max-width:100%}
.stop{font-size:13px;padding:4px 0;border-top:1px dashed var(--bd)}
details{margin-top:6px}summary{cursor:pointer;font-size:13px;color:var(--ac)}
.veh>div:first-child{min-width:0;flex:1}
input,select,textarea{font-size:16px}
button.x{min-height:38px;padding:8px 10px}
button.x.n{color:var(--ac)}
a.lk{color:var(--ac);font-weight:700;text-decoration:none;min-height:38px;padding:8px 10px;display:inline-block}
.pl{font-size:14px;padding:6px 0;border-top:1px dashed var(--bd)}
.df{margin:4px 0 0 18px;padding:0;font-size:13px}
.card>summary{font-size:16px;font-weight:700;color:var(--tx);min-height:28px}details.card{margin-top:0}details.card[open]>summary{margin-bottom:8px}
.st{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:5}.st.on{opacity:1}.st.bad{background:var(--bad);color:#fff}
.sum b{font-size:14px;overflow-wrap:anywhere}
.veh>div:last-child{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
</style>

  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");else if(/\.\d+$/.test(s))s=s.replace(/,/g,"");else s=s.replace(",",".");

const DONE={addTrip:"Sefer kaydedildi",addJob:"İş kaydedildi",importAll:"Liste içe aktarıldı",settle:"Ödeme işlendi",markPaid:"Tahsilat işlendi",makeCompany:"Firma oluşturuldu",addVeh:"Araç kaydedildi",addDrv:"Şoför kaydedildi",doneJob:"İş tamamlandı. Yanlışsa Tümü listesinden geri alabilirsin",undoJob:"İş yeniden açıldı, kasa ve cari kayıtları geri alındı",setAmt:"Fiyat kaydedildi",delJob:"İş silindi",delTrip:"Sefer silindi",delVeh:"Araç silindi",delDrv:"Şoför silindi",setEnd:"Bitiş saati kaydedildi",setRD:"Süre kaydedildi",setCap:"Kapasite kaydedildi",makeInvite:"Davet kodu oluşturuldu",delInvite:"Davet kodu iptal edildi",delMember:"Kullanıcı firmadan çıkarıldı",joinInvite:"Firmaya katıldın",savePw:"Şifren değişti",savePaste:"İşler kaydedildi"};

function msg(t,bad){const m=$("#msg");if(m){m.textContent=t||"";m.className=bad?"bad":"ok"}}
let user=null,co=null,ROLE="owner";
const REC=typeof location!="undefined"&&/type=recovery/.test(location.hash);

async function boot(){
  const r=await sb.auth.getSession();
  user=r.data.session?r.data.session.user:null;
  user?(REC?newPwView():await home()):authView();
}

function authView(){
  $("#app").innerHTML=`<h1>Filo Takip</h1><p class="sub">Araç başı kâr, maliyet ve iş takibi</p>
  <div class="card"><h2>Giriş</h2>
  <label>E-posta</label><input id="em" type="email" autocomplete="email">
  <label>Şifre (en az 6 karakter)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button onclick="login()">Giriş yap</button><button class="alt" onclick="signup()">Kayıt ol</button></div>
  <p id="msg" class="sub" role="status"></p><button class="x n" onclick="resetPw()">Şifremi unuttum</button></div>`;
}
async function login(){
  msg("Giriş yapılıyor…");
  const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(r.error){msg("Giriş yapılamadı: e-posta veya şifre hatalı ya da e-posta henüz doğrulanmadı.",true);return}
  user=r.data.user;await home();
}
async function signup(){
  const email=$("#em").value.trim(),password=$("#pw").value;
  if(!email||password.length<6){msg("E-posta yaz ve en az 6 karakterlik şifre belirle.",true);return}
  msg("Kayıt yapılıyor…");
  const r=await sb.auth.signUp({email,password});
  if(r.error){msg("Kayıt yapılamadı: "+r.error.message,true);return}
  if(r.data.session){user=r.data.user;await home()}
  else msg("Kayıt alındı. E-postana gelen doğrulama bağlantısına tıkla, sonra giriş yap.");
}
async function logout(){await sb.auth.signOut();user=null;co=null;authView()}

async function home(){
  const r=await sb.from("company_members").select("company_id, role, companies(name)").order("created_at").limit(1);
  if(r.error){$("#app").innerHTML=`<p class="bad">Veri okunamadı: ${esc(r.error.message)}</p>`;return}
  if(!r.data.length){companyView();return}
  ROLE=r.data[0].role;co={id:r.data[0].company_id,name:r.data[0].companies?r.data[0].companies.name:""};
  await vehiclesView();
}

function companyView(){
  $("#app").innerHTML=`<h1>Hoş geldin</h1><p class="sub">Başlamak için firmanı oluştur.</p>
  <div class="card"><label>Firma adı</label><input id="cn">
  <div class="row"><button onclick="makeCompany()">Firmayı oluştur</button><button class="alt" onclick="logout()">Çıkış</button></div>
  <p id="msg" class="sub" role="status"></p></div>
  <div class="card"><h2>Davet kodum var</h2><p class="sub">Bir firmanın operasyoncusuysan, firma sahibinin verdiği kodu yaz.</p><label>Davet kodu</label><input id="ic" autocapitalize="characters" autocomplete="off"><div class="row"><button onclick="joinInvite()">Firmaya katıl</button></div></div>`;
}
async function joinInvite(){
  const c=$("#ic").value.trim();if(!c){msg("Davet kodunu yaz.",true);return}
  const r=await sb.rpc("accept_invite",{p_code:c});if(r.error){msg(errText(r.error),true);return}await home();
}
async function resetPw(){
  const email=$("#em").value.trim();if(!email){msg("Önce e-posta adresini yaz.",true);return}
  const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(r.error){msg("Gönderilemedi: "+errText(r.error),true);return}
  msg("Şifre yenileme bağlantısı e-postana gönderildi. Bağlantıya tıklayınca yeni şifreni belirleyeceksin.");
}
function newPwView(){
  $("#app").innerHTML=`<h1>Yeni şifre</h1><div class="card"><label>Yeni şifre (en az 6 karakter)</label><input id="np" type="password" autocomplete="new-password"><div class="row"><button onclick="savePw()">Şifreyi kaydet</button></div><p id="msg" class="sub" role="status"></p></div>`;
}
async function savePw(){
  const p=$("#np").value;if(p.length<6){msg("En az 6 karakter yaz.",true);return}
  const r=await sb.auth.updateUser({password:p});if(r.error){msg("Kaydedilemedi: "+errText(r.error),true);return}
  try{history.replaceState(null,"",location.pathname)}catch(e){}await home();
}

async function makeCompany(){
  const name=$("#cn").value.trim();
  if(!name){msg("Firma adını yaz.",true);return}
  msg("Oluşturuluyor…");
  const c=await sb.from("companies").insert({name}).select("id,name").single();
  if(c.error){msg("Firma oluşturulamadı: "+c.error.message,true);return}
  const m=await sb.from("company_members").insert({company_id:c.data.id,user_id:user.id,role:"owner",email:user.email||null});
  if(m.error){msg("Üyelik eklenemedi: "+m.error.message,true);return}
  ROLE="owner";co={id:c.data.id,name:c.data.name};await vehiclesView();
}

let TAB=(typeof location!="undefined"&&location.hash.length==2&&"opjsctv".includes(location.hash[1])&&location.hash[1])||"o",VEH=[],DRV=[],AGN=[];
const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0),fm=n=>Math.round(n).toLocaleString("tr-TR")+" ₺";
async function vehiclesView(t){
  const g=++GEN,sy=(!t||t===TAB)&&typeof scrollY=="number"?scrollY:0;
  if(t&&t!==TAB&&$("#tab"))$("#tab").innerHTML='<p class="sub">Yükleniyor…</p>';
  TAB=t||TAB;if(ROLE!="owner"&&"ctp".includes(TAB))TAB="o";try{history.replaceState(null,"","#"+TAB)}catch(e){}
  const [r,dr,ag]=await Promise.all([sb.from("vehicles").select("*").eq("company_id",co.id).order("plate"),sb.from("drivers").select("*").eq("company_id",co.id).order("name"),sb.from("agencies").select("id,name").eq("company_id",co.id).order("name")]);
  if(g!==GEN)return;
  if(r.error||dr.error||ag.error){$("#app").innerHTML=`<p class="bad">${esc(errText(r.error||dr.error||ag.error))}</p><button class="alt" onclick="vehiclesView()">Tekrar dene</button>`;return}
  VEH=r.data||[];DRV=dr.data||[];AGN=ag.data||[];
  $("#app").innerHTML=`<div class="top"><div><h1>${esc(co.name)}</h1><p class="sub">${esc(user.email)}</p></div><button class="alt" onclick="logout()">Çıkış</button></div>
  <div class="tabs" id="mt">${[["o","Plan"],["j","İşler"],["s","Şoförler"],["c","Cari"],["t","Seferler"],["v","Araçlar"],["p","Panel"]].filter(x=>ROLE=="owner"||!"ctp".includes(x[0])).map(x=>`<button class="${TAB==x[0]?"":"alt"}" onclick="vehiclesView('${x[0]}')">${x[1]}</button>`).join("")}</div><div id="tab"></div>`;
  await ({o:planTab,p:panelTab,j:jobTab,s:drvTab,c:cariTab,t:tripTab,v:vehTab})[TAB]();
  const ab=$("#mt button:not(.alt)");if(ab&&ab.scrollIntoView)ab.scrollIntoView({inline:"center",block:"nearest"});
  if(sy&&g===GEN&&typeof scrollTo=="function")scrollTo(0,sy);
}
async function panelTab(){
  if(!VEH.length){$("#tab").innerHTML=`<p class="sub">Henüz araç yok. Hesaplar araç eklenince görünür.</p><button onclick="vehiclesView('v')">Araç ekle</button>`;return}
  const g0=GEN,from=today(new Date(Date.now()-29*864e5));
  const [r,jr]=await Promise.all([
    sb.from("trips").select("vehicle_id,revenue,fuel_cost,other_cost,km,fuel_liters,trip_date").eq("company_id",co.id).gte("trip_date",from).limit(5000),
    sb.from("jobs").select("vehicle_id,amount,currency,partner_share,job_date").eq("company_id",co.id).eq("status","tamamlandi").not("vehicle_id","is",null).gte("job_date",from).limit(5000)]);
  if(g0!==GEN||!need(r,jr))return;
  const T=r.data||[],J=jr.data||[],FX={};
  const rows=VEH.map(v=>{const t=T.filter(x=>x.vehicle_id==v.id),jt=J.filter(x=>x.vehicle_id==v.id),fx={};let gj=0;
    jt.forEach(x=>{const n=Number(x.amount||0)-Number(x.partner_share||0);if(x.currency=="TRY")gj+=n;else{fx[x.currency]=(fx[x.currency]||0)+n;FX[x.currency]=(FX[x.currency]||0)+n}});
    const g=sum(t,"revenue")+gj,km=sum(t,"km"),L=sum(t,"fuel_liters"),days=new Set(t.map(x=>x.trip_date).concat(jt.map(x=>x.job_date))).size,cost=sum(t,"fuel_cost")+sum(t,"other_cost")+Number(v.monthly_fixed_cost||0);
    return{v,g,cost,net:g-cost,km,days,jobs:jt.length,fx,l:km?L/km*100:0,dc:days?cost/days:0,kc:km?cost/km:0}});
  const G=sum(rows,"g"),C=sum(rows,"cost"),fxs=o=>Object.keys(o).filter(c=>o[c]).map(c=>fc(o[c],c)).join(" + ");
  $("#tab").innerHTML=`<p class="sub">Son 30 gün. Gelir = seferler + tamamlanan işler (işi atana verilen pay düşülür). Sabit gider aylık tutar olarak eklenir.</p>
  <div class="sum"><div><span class="k">Gelir</span><b>${fm(G)}</b></div><div><span class="k">Gider</span><b>${fm(C)}</b></div><div><span class="k">Net</span><b class="${G-C>=0?"pos":"neg"}">${fm(G-C)}</b></div></div>${fxs(FX)?`<p class="sub warn">Dövizli gelir ayrıca: ${fxs(FX)} (₺ toplamına dahil değil)</p>`:""}`+
  rows.map(x=>{const hi=x.v.base_consumption&&x.l>x.v.base_consumption*1.1;return `<div class="card"><div class="top"><b>${esc(x.v.plate)}</b><span class="${x.net>=0?"pos":"neg"}">${fm(x.net)} net</span></div>${fxs(x.fx)?`<span class="k">+ ${fxs(x.fx)} dövizli gelir</span>`:""}<div class="g2"><div><span class="k">Günlük maliyet</span><br><b>${x.days?fm(x.dc):"-"}</b></div><div><span class="k">Km başı maliyet</span><br><b>${x.km?x.kc.toFixed(1)+" ₺":"-"}</b></div><div><span class="k">Çalışılan gün / iş</span><br><b>${x.days} / ${x.jobs}</b></div><div><span class="k">L/100 km</span><br><b class="${hi?"warn":""}">${x.km&&x.l?x.l.toFixed(1):"-"}${hi?" (yüksek)":""}</b></div></div></div>`}).join("");
}
async function tripTab(){
  if(!VEH.length){$("#tab").innerHTML=`<p class="sub">Henüz araç yok. Hesaplar araç eklenince görünür.</p><button onclick="vehiclesView('v')">Araç ekle</button>`;return}
  const [r,ag]=await Promise.all([
    sb.from("trips").select("id,trip_date,km,revenue,fuel_cost,other_cost,invoiced,collected_on,vehicle_id,agency_id").eq("company_id",co.id).order("trip_date",{ascending:false}).limit(20),
    sb.from("agencies").select("id,name").eq("company_id",co.id)]);
  if(!need(r,ag))return;
  const an={};(ag.data||[]).forEach(a=>an[a.id]=a.name);
  const pv={};VEH.forEach(v=>pv[v.id]=v.plate);
  const opt=VEH.map(v=>`<option value="${v.id}">${esc(v.plate)}</option>`).join("");
  const list=(r.data||[]).map(t=>`<div class="veh"><div><b>${esc(pv[t.vehicle_id]||"")}</b> <span class="k">${t.trip_date.slice(8)+"."+t.trip_date.slice(5,7)} · ${esc(an[t.agency_id]||"acenta yok")} · ${t.km} km</span><br><span class="${t.revenue-t.fuel_cost-t.other_cost>=0?"pos":"neg"}">${fm(t.revenue-t.fuel_cost-t.other_cost)}</span> <span class="k">(gelir ${fm(t.revenue)})</span><br>${t.invoiced?"":'<span class="tag">fatura kesilmedi</span>'}${t.collected_on?"":'<span class="tag">tahsil edilmedi</span>'}</div><div>${t.collected_on?"":`<button class="x" onclick="markPaid('${t.id}')">Tahsil edildi</button>`}<button class="x" onclick="delTrip('${t.id}')">Sil</button></div></div>`).join("")||`<p class="sub">Henüz sefer yok.</p>`;
  $("#tab").innerHTML=`<div class="card"><h2>Sefer ekle</h2>
  <label>Araç</label><select id="tv">${opt}</select>
  <div class="f2"><div><label>Tarih</label><input id="td" type="date" value="${today()}"></div><div><label>Acenta</label><input id="ta"></div>
  <div><label>Km</label><input id="tk" inputmode="numeric"></div><div><label>Gelir (₺)</label><input id="tg" inputmode="decimal"></div>
  <div><label>Yakıt (litre)</label><input id="tl" inputmode="decimal"></div><div><label>Yakıt tutarı (₺)</label><input id="ty" inputmode="decimal"></div>
  <div><label>Geçiş ve diğer (₺)</label><input id="to" inputmode="decimal"></div></div>
  <label class="chk"><input id="ti" type="checkbox"> Fatura kesildi</label>
  <div class="row"><button onclick="addTrip()">Seferi kaydet</button></div><p id="msg" class="sub" role="status"></p></div>
  <div class="card"><h2>Son seferler</h2>${list}</div>`;
}
async function addTrip(){
  const km=num($("#tk").value),g=num($("#tg").value);
  if(km==null||g==null||km<0||g<0){msg("Km ve gelir zorunlu, eksi olamaz.",true);return}
  let aid=null;const an=$("#ta").value.trim();
  if(an){const a=await sb.from("agencies").upsert({company_id:co.id,name:an},{onConflict:"company_id,name"}).select("id").single();
    if(a.error){msg("Acenta kaydedilemedi: "+a.error.message,true);return}aid=a.data.id}
  const r=await sb.from("trips").insert({company_id:co.id,vehicle_id:$("#tv").value,agency_id:aid,trip_date:$("#td").value,km:Math.round(km),revenue:g,fuel_liters:num($("#tl").value)||0,fuel_cost:num($("#ty").value)||0,other_cost:num($("#to").value)||0,invoiced:$("#ti").checked});
  if(r.error){msg("Kaydedilemedi: "+r.error.message,true);return}
  await vehiclesView("t");

// Rehber Transfer Listesi (PDF) ayrıştırıcı. pages: [[{s,x,y}]]
function parseTransferList(pages){
  const runs=new Map(),warn=[];let stop=null,voucher=null,pax=null,last=[];
  const dIso=s=>{const m=s.match(/(\d\d)\/(\d\d)\/(\d{2,4})/);return m?(m[3].length==2?"20"+m[3]:m[3])+"-"+m[2]+"-"+m[1]:null};
  const at=(row,a,b)=>row.filter(i=>i.x>=a&&i.x<b).map(i=>i.s.trim()).join(" ").trim();
  for(const items of pages){
    pax=null;const rows=[];
    for(const it of items.slice().sort((a,b)=>b.y-a.y||a.x-b.x)){const r=rows[rows.length-1];if(r&&Math.abs(r.y-it.y)<=2.5)r.it.push(it);else rows.push({y:it.y,it:[it]})}
    rows.forEach(r=>r.it.sort((a,b)=>a.x-b.x));
    const ti=rows.findIndex(r=>r.it.some(i=>/TRANSFER L[İI]STES[İI]/i.test(i.s)));
    let guide="",dir=null;
    if(ti>=0){const t=rows[ti].it.find(i=>/TRANSFER L[İI]STES[İI]/i.test(i.s)).s.toLocaleUpperCase("tr");
      dir=/DÖNÜŞ|DONUS/.test(t)?"depar":/GEL[İI]Ş|GELIS/.test(t)?"varis":null;
      for(const r of rows.slice(0,ti)){const g=r.it.find(i=>i.x>150&&i.x<450&&!/\d/.test(i.s));if(g){guide=g.s.trim();break}}}
    for(const r of rows){const row=r.it,txt=row.map(i=>i.s).join(" ");
      if(/^\d+-$/.test(at(row,0,30))&&/^\d\d\/\d\d\/\d\d/.test(at(row,30,62))){
        const route=at(row,118,172).split("=>"),tr=at(row,172,372),d=dir||(/^BJV/.test(route[0])?"varis":"depar"),parts=tr.split("=>");
        const veh=at(row,392,440),run=at(row,526,556),date=dIso(at(row,30,62));
        const place=(d=="depar"?parts[0]:parts.slice(1).join("=>"))||tr,fl=(d=="depar"?parts.slice(1).join("=>"):parts[0])||"";
        const key=[d,date,veh,run||"-"].join("|");
        if(!runs.has(key))runs.set(key,{key,dir:d,date,veh,run,guide,type:at(row,62,98),flightTime:at(row,98,118),stops:[],total:null});
        stop={place:place.trim(),flight:fl.trim(),from:route[0]||"",to:route[1]||"",pax:parseInt(at(row,372,392))||0,time:at(row,440,470),no:at(row,512,526),region:"",op:"",rec:"",note:"",people:[]};
        runs.get(key).stops.push(stop);last=[key];voucher=null;pax=null;continue}
      if(stop&&txt.includes("***")){
        stop.region=at(row,0,185);stop.op=at(row,200,255);
        const m=txt.match(/Kayıt No\s*:\s*(\d+)/);if(m)stop.rec=m[1];
        stop.note=at(row,326,600).replace(/^Not\s*/,"").replace(/^\+$/,"").trim();continue}
      const tp=txt.match(/TOPLAM PAX\s*(\d+)?/);
      if(tp){const n=parseInt(tp[1]||at(row,600,900)||(row[row.length-1].s))||null;const k=last[0];if(k&&runs.has(k))runs.get(k).total=n;stop=null;continue}
      if(!stop)continue;
      const title=at(row,130,148),seq=at(row,112,130),v=at(row,40,110),name=at(row,148,248);
      if(/^(Mr|Mrs|Ms|Miss|Chd|Inf|Bay|Bayan)\.?$/i.test(title)){
        if(/^\d{5,}\w?$/.test(v))voucher=v;
        pax={voucher,title,name:name.replace(/^Child\s+/i,""),age:parseInt(at(row,248,270))||null};stop.people.push(pax);continue}
      if(/^\d{5,}\w?$/.test(v)&&!title){if(pax&&!seq){pax.voucher=v;voucher=v}else voucher=v;}
      if(pax&&name&&!title&&!/\d/.test(name)&&!/Müşteri|Havalimanı/.test(txt))pax.name+=" "+name;
    }
  }
  const out=[...runs.values()];
  for(const r of out){r.pax=r.stops.reduce((s,x)=>s+x.pax,0);
    const c={};r.stops.forEach(s=>{const m=s.flight.match(/^[A-Z0-9]{2}\s?\d{3,4}\b/);if(m)c[m[0]]=(c[m[0]]||0)+1});
    r.flight=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||"";
    const ts=r.stops.map(s=>s.time).filter(Boolean).sort();r.firstTime=ts[0]||"";
    r.regions=[...new Set(r.stops.map(s=>(r.dir=="depar"?s.region.split("=>")[0]:s.region.split("=>")[1])||"").filter(Boolean))];
    r.airport=(r.stops[0].region.split("=>")[r.dir=="depar"?1:0]||"").trim();
    if(r.total!=null&&r.total!=r.pax)warn.push(`${r.veh} ${r.run}: liste toplamı ${r.total}, durakların toplamı ${r.pax}`);
    r.stops.forEach(s=>{const n=s.people.filter(p=>!/^inf$/i.test(p.title)).length;if(n!=s.pax)s.mismatch=n})}
  return{runs:out,warn}
}

  e.innerHTML=`<div class="card"><h2>Fiyat ve silme kayıtları</h2><p class="sub">Bir işin fiyatı girildiğinde ya da değiştiğinde ve bir iş silindiğinde buraya yazılır. Bu kayıtlar değiştirilemez ve silinemez.</p>${(r.data||[]).map(x=>`<div class="pl"><b>${x.action=="silindi"?"İş silindi":"Fiyat"}</b> <span class="k">${t(x.created_at)} · ${esc(x.email||"bilinmiyor")}</span><br>${esc(x.job_label||"")}<br>${x.action=="silindi"?`<span class="neg">silinen işin fiyatı ${fc(x.old_amount||0,x.old_currency||"TRY")}</span>`:`${x.old_amount!=null?fc(x.old_amount,x.old_currency)+" → ":""}<b>${fc(x.new_amount,x.new_currency)}</b>`}</div>`).join("")||'<p class="sub">Henüz kayıt yok.</p>'}</div>`;
}
async function settle(k,id,cur,bal){
  const t=prompt((k=="d"?"Teslim alınan tutar (":"Tutar (")+cur+")",Math.abs(bal));if(t===null)return;
  const a=num(t);if(a==null||a<=0){alert("Geçerli bir tutar yaz.");return}
  if(a>Math.abs(bal)+0.005&&!confirm("Yazdığın tutar bakiyeden fazla. Devam edilsin mi?"))return;
  const row={company_id:co.id,currency:cur,amount:(bal>0?-1:1)*a,kind:k=="d"?"teslim":"odeme"};
  row[k=="d"?"driver_id":"agency_id"]=id;
  const r=await sb.from("ledger_entries").insert(row);
  if(r.error){alert(errText(r.error));return}await vehiclesView(k=="d"?"s":"c");
}
async function addVeh(){
  const plate=$("#pl").value.trim().toUpperCase();
  if(!plate){msg("Plakayı yaz.",true);return}
  const o=num($("#od").value);
  const r=await sb.from("vehicles").insert({company_id:co.id,plate,monthly_fixed_cost:num($("#fx").value)||0,base_consumption:num($("#bc").value),home_city:$("#hc").value.trim()||null,capacity:(c=>c&&c>0?Math.round(c):null)(num($("#cp").value)),odometer_km:o==null?null:Math.round(o)});
  if(r.error){msg(r.error.code==="23505"?"Bu plaka zaten kayıtlı.":"Kaydedilemedi: "+r.error.message,true);return}
  await vehiclesView();
}
async function delVeh(id,plate){
  if(!confirm(plate+" aracı silinsin mi?"))return;
  const r=await sb.from("vehicles").delete().eq("id",id);
  if(r.error){alert("Silinemedi: bu araca bağlı sefer ya da kayıtlar olabilir.");return}
  await vehiclesView();
}
for(const n of ["addTrip","addJob","importAll","settle","markPaid","makeCompany","addVeh","addDrv","doneJob","setAmt","delJob","delTrip","delVeh","delDrv","setJobVeh","setJobDrv","setDefDrv","setEnd","setRD","savePaste","readPaste","undoJob","setCap","makeInvite","delInvite","delMember","joinInvite","savePw","resetPw"])globalThis[n]=once(n,globalThis[n]);
boot().catch(e=>{$("#app").innerHTML=`<p class="bad">Uygulama açılamadı: ${esc(e.message)}. Bağlantını kontrol edip sayfayı yenile.</p>`});
